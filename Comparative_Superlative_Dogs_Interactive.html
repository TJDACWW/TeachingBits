function updateSortUI(key){const res=state.sortResults[key],feed=$('#sort-feedback');if(!feed)return;if(res==='correct'){feed.className='feedback success';feed.innerHTML='<span class="status-icon">✓</span> Correct order!'}else if(res==='wrong'){feed.className='feedback error';feed.innerHTML='<span class="status-icon">×</span> Not quite — try moving the cards.'}else{feed.className='feedback';feed.innerHTML='<span class="tip">Drag to rearrange, then check your order.</span>'}document.querySelectorAll('.sort-card').forEach(el=>{el.classList.toggle('selected',state.selectedSort[key]===el.dataset.id);el.classList.toggle('correct',res==='correct')})}

function finishPointerDrag(commit){const d=activeDrag;if(!d)return;d.el.removeEventListener('pointermove',onPointerMove);d.el.removeEventListener('lostpointercapture',onPointerCancel);d.el.style.opacity='';d.target?.classList.remove('over');d.ghost?.remove();activeDrag=null;if(commit&&d.moved){window._draggedAt=performance.now();if(d.type==='sort'&&d.target&&d.target.dataset.id!==d.el.dataset.id)swapSort(d.el.dataset.sortkey,d.el.dataset.id,d.target.dataset.id);else if(d.type==='chip'&&d.target)assignSlot(Number(d.target.dataset.slot),Number(d.el.dataset.opt))}}
function onPointerUp(e){if(activeDrag&&e.pointerId===activeDrag.pointerId)finishPointerDrag(true)}
function onPointerCancel(e){if(!activeDrag||e.pointerId===undefined||e.pointerId===activeDrag.pointerId)finishPointerDrag(false)}
window.addEventListener('pointerup',onPointerUp);window.addEventListener('pointercancel',onPointerCancel);window.addEventListener('blur',()=>finishPointerDrag(false));
document.addEventListener('keydown',e=>{if(e.target.closest('button')&&(e.key===' '||e.key==='Enter'))return;if(e.key==='Escape'){if(state.ref||state.help){state.ref=false;state.help=false;rendering()}}if(state.ref||state.help)return;if(e.key==='ArrowRight'){e.preventDefault();goNext()}else if(e.key==='ArrowLeft'){e.preventDefault();goPrev()}else if(e.key.toLowerCase()==='f'&&!e.ctrlKey&&!e.altKey){toggleFullscreen()}else if(e.key.toLowerCase()==='r'&&!e.ctrlKey&&!e.altKey){toggleReference()}});
rendering();
</script>
