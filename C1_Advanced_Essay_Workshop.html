<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>C1 Advanced | Essay Workshop</title>
<style>
:root {color-scheme:light; --paper:#f7f7f4; --surface:#fff; --ink:#213039; --muted:#52616a; --line:#d4dbd9; --soft:#eef2ef; --accent:#1e5355; --accent-strong:#124142; --accent-soft:#e6efec; --warm:#edece5; --warning:#754b20; --warn-bg:#f8f2e7; --success:#175a45; --success-bg:#e7f3ec; --reader-scale:1; --reader-base:1.075rem; --max:73rem;}
*{box-sizing:border-box}
html {scroll-behavior:auto}
body {margin:0;background:var(--paper);color:var(--ink);font-family:"Open Sans","Segoe UI",Arial,sans-serif;font-size:1rem;line-height:1.53;overflow-wrap:anywhere}
button,textarea,select,input{font:inherit}
button,select{cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
a{color:var(--accent);text-underline-offset:.18em}
:focus-visible{outline:3px solid #9c6c27;outline-offset:3px}
[hidden]{display:none!important}
.skip-link{position:absolute;left:.75rem;top:-5rem;z-index:100;padding:.6rem;background:#fff}
.skip-link:focus{top:.5rem}
header{border-bottom:1px solid var(--line);background:#fff}
.topbar{max-width:var(--max);margin:auto;display:flex;align-items:center;justify-content:space-between;gap:.8rem;padding:.8rem clamp(.75rem,2.3vw,1.55rem);flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:.7rem;min-width:0}
.brand-mark{border-left:.25rem solid var(--accent);padding-left:.65rem;font-weight:750;white-space:nowrap;letter-spacing:.01em}
.brand-detail{color:var(--muted);font-size:.83rem}
.toolbar{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;border:1px solid var(--line);background:#fff;border-radius:.33rem;color:var(--ink);padding:.48rem .82rem;min-height:2.65rem;font-size:.94rem;font-weight:600;text-decoration:none;line-height:1.25;white-space:normal;text-align:center}
.btn:hover:not(:disabled){background:var(--soft);border-color:#a7b8b4}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover:not(:disabled){background:var(--accent-strong);border-color:var(--accent-strong)}
.btn-subtle{background:transparent;border-color:transparent;color:var(--muted)}
.btn-subtle:hover:not(:disabled){background:var(--soft)}
.btn-sm{min-height:2.4rem;padding:.36rem .64rem;font-size:.86rem}
.btn-text{border:none;border-bottom:1px solid currentColor;border-radius:0;background:none;padding:.2rem .05rem;min-height:auto;text-align:left;color:var(--accent)}
main{max-width:var(--max);margin:0 auto;padding:0 clamp(.75rem,2.3vw,1.55rem) 3rem}
nav.stages{display:flex;gap:.32rem;border-bottom:1px solid var(--line);padding:.65rem 0;overflow-x:auto;scrollbar-width:thin}
.nav-stage{background:transparent;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:.48rem .68rem .5rem;font-size:.87rem;font-weight:650;white-space:nowrap;min-height:2.5rem}
.nav-stage:hover{background:var(--soft)}
.nav-stage[aria-current="step"]{color:var(--accent-strong);border-bottom-color:var(--accent)}
.nav-stage .nav-n{font-variant-numeric:tabular-nums;color:#71807c;margin-right:.3rem}
.nav-stage[aria-current="step"] .nav-n{color:inherit}
.mobile-stage-nav{display:none;border-bottom:1px solid var(--line);padding:.7rem 0}
.stage-select{width:100%;min-height:2.65rem;border:1px solid var(--line);background:#fff;border-radius:.33rem;padding:.42rem .6rem;color:var(--ink)}
.section-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1rem;align-items:start;margin-top:1.65rem;margin-bottom:1.25rem}
.eyebrow{text-transform:uppercase;letter-spacing:.11em;font-weight:800;font-size:.72rem;color:var(--accent);margin-bottom:.2rem}
h1,h2,h3,p{margin:0}
h1{font-size:clamp(1.5rem,1rem + .9vw,2rem);line-height:1.2;font-weight:750;letter-spacing:-.03em}
h2{font-size:1.22rem;line-height:1.3;letter-spacing:-.017em;font-weight:730}
h3{font-size:1.03rem;line-height:1.4;font-weight:700}
.lede{font-size:calc(var(--reader-base)*var(--reader-scale));color:#394950;max-width:67ch;line-height:1.57;margin-top:.42rem}
.stage-meta{display:flex;align-items:center;justify-content:flex-end;gap:.45rem;flex-wrap:wrap}
.clock{min-width:4.2rem;text-align:center;font-size:.95rem;font-variant-numeric:tabular-nums;font-weight:750;border:1px solid var(--line);border-radius:.25rem;background:#fff;padding:.4rem .52rem}
.clock.expired{color:var(--warning);background:var(--warn-bg)}
.grid-main{display:grid;grid-template-columns:minmax(0,1fr) minmax(13.5rem,19rem);gap:1.1rem;align-items:start}
.content-stack,.support-stack{display:grid;gap:1rem;min-width:0}
.panel{border:1px solid var(--line);border-radius:.35rem;background:var(--surface);padding:clamp(.8rem,1.8vw,1.25rem);min-width:0}
.panel-plain{padding:0;border:none;background:transparent}
.panel-muted{background:var(--soft)}
.panel-heading{display:flex;align-items:baseline;gap:.8rem;justify-content:space-between;flex-wrap:wrap;margin-bottom:.7rem}
.task-marker{display:inline-block;color:var(--muted);font-size:.8rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.reader{font-size:calc(var(--reader-base)*var(--reader-scale));line-height:1.64;max-width:73ch}
.reader p+p{margin-top:.6rem}
.small{color:var(--muted);font-size:.89rem}
.micro{font-size:.8rem;color:var(--muted)}
.strong{font-weight:730}
.section-label{font-size:.81rem;font-weight:750;letter-spacing:.065em;text-transform:uppercase;color:var(--muted);margin-bottom:.5rem}
.flow{display:grid;gap:1rem}
.tight{display:grid;gap:.6rem}
.reference{border-left:.22rem solid var(--accent);background:var(--accent-soft);padding:.85rem .95rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;border-radius:.16rem}
.reference-label{font-size:.8rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-strong)}
.reference p{font-size:.91rem;line-height:1.48;margin:.18rem 0 0}
.reference .small{color:#425e5d}
.stack-actions{display:flex;flex-wrap:wrap;align-items:center;gap:.55rem}
.choice-grid{display:grid;gap:.55rem}
.choice{display:flex;align-items:flex-start;gap:.7rem;text-align:left;background:#fff;border:1px solid #c9d4d0;border-radius:.3rem;padding:.7rem .8rem;min-height:2.9rem;width:100%;color:var(--ink);font-size:calc(var(--reader-base)*var(--reader-scale));line-height:1.48}
.choice:hover{border-color:#6b948c;background:#f3f7f5}
.choice[aria-pressed="true"],.choice.selected{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset .2rem 0 var(--accent)}
.option-code{flex:0 0 auto;min-width:1.55rem;height:1.55rem;border:1px solid #b6c4bf;border-radius:.2rem;text-align:center;font-size:.82rem;font-weight:700;line-height:1.45rem;background:#fff;color:var(--muted)}
.choice[aria-pressed="true"] .option-code{background:var(--accent);border-color:var(--accent);color:#fff}
.choice.copy{font-size:calc(var(--reader-base)*var(--reader-scale))}
.field-label{display:block;font-weight:730;font-size:.91rem;margin-bottom:.35rem}
textarea,.text-input{display:block;width:100%;border:1px solid #acbcb8;background:#fff;color:var(--ink);border-radius:.3rem;padding:.66rem .75rem;font-size:calc(var(--reader-base)*var(--reader-scale));line-height:1.55;resize:vertical;min-height:5.1rem}
textarea:focus{outline:2px solid #5a8880;outline-offset:1px}
textarea.short{min-height:4rem}
textarea.editor{min-height:12.5rem}
select.inline-select{display:block;width:100%;max-width:42rem;min-height:2.55rem;border:1px solid #acbcb8;background:#fff;border-radius:.25rem;padding:.35rem .6rem;color:var(--ink);font-size:.94rem}
.feedback{border-left:.2rem solid var(--accent);background:var(--soft);padding:.72rem .84rem;border-radius:.14rem;display:grid;gap:.2rem;line-height:1.5;font-size:.93rem}
.feedback.positive{border-color:var(--success);background:var(--success-bg)}
.feedback.caution{border-color:#b1854f;background:var(--warn-bg)}
.divider{height:1px;background:var(--line);margin:.1rem 0}
.badge-min{color:var(--muted);border:1px solid var(--line);font-size:.78rem;padding:.12rem .42rem;border-radius:.2rem;white-space:nowrap;font-weight:650}
.step-actions{display:flex;flex-wrap:wrap;gap:.65rem;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:1.2rem;margin-top:1.3rem}
.step-actions>div{display:flex;flex-wrap:wrap;gap:.5rem}
.sidebox{border-top:2px solid var(--line);padding-top:.7rem}
.sidebox h3{font-size:.94rem;margin-bottom:.38rem}
.sidebox p,.sidebox li{font-size:.87rem;color:var(--muted)}
.sidebox ul{padding-left:1.05rem;margin:.25rem 0 0}
.sidebox li+li{margin-top:.25rem}
.hint{border:1px solid #c8d5d0;border-radius:.28rem;background:#f7faf8;padding:.7rem .8rem;font-size:.92rem;color:#344d4c}
.hint summary{cursor:pointer;font-weight:700;color:var(--accent)}
.hint p{margin-top:.5rem}
.quiz-progress{font-size:.85rem;color:var(--muted)}
.method-picker{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.6rem}
.method-option{display:flex;align-items:flex-start;gap:.45rem;padding:.7rem;border:1px solid #bdccc7;border-radius:.28rem;background:#fff;font-weight:680;font-size:.93rem;cursor:pointer;min-width:0}
.method-option:has(input:checked){background:var(--accent-soft);border-color:var(--accent)}
.method-option input{accent-color:var(--accent);margin-top:.23rem;width:1.05rem;height:1.05rem;flex:0 0 auto}
.tabs{display:flex;flex-wrap:wrap;gap:.38rem;border-bottom:1px solid var(--line);padding-bottom:.55rem}
.tab{background:none;border:1px solid var(--line);border-radius:.24rem;padding:.43rem .7rem;color:var(--muted);font-weight:650;min-height:2.5rem;text-align:left}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.two-col{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.8rem}
.notepaper{background:#f8f8f5;border:1px solid #daddd5;border-radius:.25rem;padding:.75rem .85rem}
.notepaper h3{margin-bottom:.25rem}
.notesline{display:grid;gap:.25rem;padding:.55rem 0;border-bottom:1px solid #dae0dc;font-size:.9rem}
.notesline:last-child{border-bottom:0}
.notesline strong{font-size:.8rem;text-transform:uppercase;color:var(--muted);letter-spacing:.05em}
.match-row{display:grid;grid-template-columns:minmax(7rem,.75fr) minmax(0,2fr);gap:.6rem;align-items:center;padding:.45rem 0;border-bottom:1px solid #e5e9e6}
.match-row:last-child{border-bottom:0}
.match-row label{font-weight:680;font-size:.91rem}
.match-row small{font-size:.83rem;color:var(--muted)}
.checkline{display:flex;align-items:flex-start;gap:.6rem;font-size:.96rem;line-height:1.5;cursor:pointer}
.checkline input{margin-top:.29rem;width:1.05rem;height:1.05rem;flex:0 0 auto;accent-color:var(--accent)}
.word-count{font-weight:700;font-variant-numeric:tabular-nums;font-size:.91rem;color:var(--muted)}
.summary-row{display:flex;flex-wrap:wrap;align-items:center;gap:.75rem;justify-content:space-between}
.screenreader{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
footer{max-width:var(--max);padding:.9rem clamp(.75rem,2.3vw,1.55rem) 2rem;margin:0 auto;border-top:1px solid var(--line);color:var(--muted);font-size:.78rem}
footer p+p{margin-top:.25rem}
@media (min-width:95rem){:root{--reader-base:1.18rem} h1{font-size:2.1rem} .panel{padding:1.4rem} main{max-width:84rem} .topbar,footer{max-width:84rem}}
@media (max-width:61rem){nav.stages{display:none}.mobile-stage-nav{display:block}.grid-main{grid-template-columns:minmax(0,1fr)}.support-stack{grid-template-columns:repeat(2,minmax(0,1fr));gap:.8rem}.support-stack>.reference{grid-column:1/-1}}
@media (max-width:45rem){.topbar{padding:.7rem .85rem}.brand-detail{display:none}.section-head{grid-template-columns:1fr;gap:.65rem;margin-top:1.15rem}.stage-meta{justify-content:flex-start}.method-picker{grid-template-columns:1fr}.two-col{grid-template-columns:1fr}.support-stack{grid-template-columns:1fr}.reference{flex-wrap:wrap;align-items:flex-start}.reference .btn{width:100%}.step-actions{align-items:stretch}.match-row{grid-template-columns:1fr;gap:.2rem}.toolbar .text-help{display:none}}
@media (max-width:24rem){.brand-mark{font-size:.91rem}.topbar{gap:.45rem}.toolbar{gap:.2rem}.toolbar .btn-sm{padding:.32rem .44rem}.panel{padding:.7rem}.choice{padding:.6rem}.step-actions>.btn{width:100%}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
@media print{body{background:#fff}header,nav,.mobile-stage-nav,.stage-meta,.step-actions,footer{display:none!important}main{max-width:none;padding:0}.panel{break-inside:avoid}}
</style>
</head>

<a class="skip-link" href="#workshop">Skip to activity</a>
<header>
  <div class="topbar">
    <div class="brand"><div class="brand-mark">C1 Advanced</div><div class="brand-detail">Writing Part 1 · Essay workshop</div></div>

    </div>

</header>
<main id="workshop">

<footer>

let bookObjectUrl = null;
function getBookUrl(){
  if(bookObjectUrl) return bookObjectUrl;
  const raw=atob(BOOK_PDF_B64),bytes=new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);
  bookObjectUrl=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));
  return bookObjectUrl;
}
function openBook(p){
  const url=getBookUrl()+'#page='+p;
  const w=window.open(url,'_blank');
  if(w)w.opener=null;
  else { const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener noreferrer';document.body.append(a);a.click();a.remove(); }
}
function downloadBook(){const a=document.createElement('a');a.href=getBookUrl();a.download='C1_Advanced_Essay_Textbook_Extract.pdf';document.body.append(a);a.click();a.remove();}
const STAGES=[
 {name:'Take a stand',short:'Position',minutes:5,desc:'Choose a position, support it and respond to an objection.'},
 {name:'Decode the task',short:'Task',minutes:6,desc:'Discover exactly what Cambridge expects in Writing Part 1.'},
 {name:'Build an argument',short:'Argument',minutes:9,desc:'Choose two methods and make each argument specific and convincing.'},
 {name:'Essay detective',short:'Analysis',minutes:8,desc:'Investigate how the model essay develops and connects its ideas.'},
 {name:'Upgrade the writing',short:'Editing',minutes:7,desc:'Diagnose weaknesses, revise sentences and compare alternatives.'},
 {name:'Essay sprint',short:'Writing',minutes:10,desc:'Turn your decisions into a plan and a well-developed paragraph.'}
];
const PAGES={16:1,17:2,186:3,187:4,188:5};
const esc=x=>String(x??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
const ref=(printed,desc)=>`<div class="reference"><div><div class="reference-label">Textbook · printed page ${printed}</div><p>${desc}</p></div><button type="button" class="btn btn-sm" data-action="book" data-page="${PAGES[printed]}">Open page ${printed} ↗</button></div>`;
function emptyState(){return {
 stage:0,readScale:1,
 stance:{position:'',justification:'',counter:false,response:''},
 task:{index:0,answers:{},checked:{}},
 argument:{selected:[],focus:0,choices:{courses:{reason:-1,example:-1,implication:''},experience:{reason:-1,example:-1,implication:''},advice:{reason:-1,example:-1,implication:''}},winner:'',comparison:'',objectionShown:false,objectionResponse:''},
 detective:{matches:['','','','',''],concession:'',reference:'',checked:false},
 edits:{index:0,items:[{diagnosis:'',revision:'',revealed:false},{diagnosis:'',revision:'',revealed:false},{diagnosis:'',revision:'',revealed:false}]},
 sprint:{plan:['','','',''],paragraph:'',checks:[false,false,false,false]},
 timers:STAGES.map(s=>({remaining:s.minutes*60,running:false,started:0,atStart:s.minutes*60}))
}};
let state=emptyState();
const byId=id=>document.getElementById(id);
function timerPause(i){const t=state.timers[i];if(t.running){t.remaining=Math.max(0,t.atStart-Math.floor((Date.now()-t.started)/1000));t.running=false;}}
function timerToggle(){const t=state.timers[state.stage];if(t.running)timerPause(state.stage);else if(t.remaining>0){t.running=true;t.started=Date.now();t.atStart=t.remaining;}drawHead();}
setInterval(()=>{const t=state.timers[state.stage];if(!t.running)return;const next=Math.max(0,t.atStart-Math.floor((Date.now()-t.started)/1000));if(next!==t.remaining){t.remaining=next;drawClock();}if(next===0){t.running=false;drawHead();}},250);
const clockString=n=>`${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`;
function drawClock(){const el=byId('clock');if(el){const t=state.timers[state.stage];el.textContent=clockString(t.remaining);el.classList.toggle('expired',t.remaining===0);}}

<section class="panel flow"><div class="panel-heading"><h2>Four-part essay plan</h2><span class="task-marker">Notes, not full paragraphs</span></div>${planLabels.map((label,i)=>`<div><label class="field-label" for="plan-${i}">${i+1}. ${esc(label)}</label><textarea class="short" id="plan-${i}" data-plan="${i}" placeholder="Key idea / supporting point…">${esc(s.plan[i])}</textarea></div>`).join('')}</section></div>
<section class="panel flow"><div class="panel-heading"><h2>Write one developed body paragraph</h2><span class="word-count" id="word-counter" aria-live="polite">${wordCount(s.paragraph)} words</span></div><p class="small">Aim for approximately 90–120 words. Start with a clear claim, develop a reason, support it and show why it matters. This paragraph is practice, not the complete exam essay.</p><label class="screenreader" for="sprint-paragraph">Your body paragraph</label><textarea class="editor" id="sprint-paragraph" data-field="sprint.paragraph" placeholder="One important advantage of … is that …">${esc(s.paragraph)}</textarea><div class="stack-actions"><button class="btn" type="button" data-action="copy-paragraph">Copy paragraph</button><button class="btn" type="button" data-action="export">Download work (.txt)</button></div></section>
<section class="panel flow"><div class="panel-heading"><h2>Review your paragraph</h2><span class="task-marker">Cambridge assessment areas</span></div><p class="small">Use these prompts to guide a revision. They are not an automatic Cambridge score.</p><div class="tight">${CHECKS.map(([name,desc],i)=>`<label class="checkline"><input type="checkbox" data-action="sprint-check" data-index="${i}" ${s.checks[i]?'checked':''}><span><strong>${name}:</strong> ${desc}</span></label>`).join('')}</div><div class="feedback"><strong>After the lesson</strong><p>Use your plan to complete the full 220–260-word essay. Revisit printed pages 16–17 or 187 for writing reference, then edit it using these four checks.</p></div></section>
</div>`;}
function exportWork(){
 const a=state.argument,sel=a.selected;
 const lines=['C1 ADVANCED · WRITING PART 1','Essay workshop · Student work','',
 'STAGE 1 · TAKE A STAND',`Position: ${state.stance.position||'—'}`,`Justification: ${state.stance.justification||'—'}`,`Response to objection: ${state.stance.response||'—'}`,'',
 'STAGE 2 · TASK CHECK',...QUESTIONS.map((q,i)=>`${i+1}. ${q.q}\n   Answer: ${q.opts[state.task.answers[i]]||'Not answered'}`),'',
 'STAGE 3 · BUILD AN ARGUMENT',...sel.flatMap(k=>[METHODS[k].title,`   Claim: ${METHODS[k].claim}`,`   Reason: ${pickedText(k,'reason')}`,`   Example: ${pickedText(k,'example')}`,`   Implication: ${a.choices[k].implication||'—'}`]),`Preferred method: ${a.winner?METHODS[a.winner].title:'—'}`,`Comparison: ${a.comparison||'—'}`,`Reply to objection: ${a.objectionResponse||'—'}`,'',
 'STAGE 4 · ESSAY DETECTIVE',`Paragraph functions: ${state.detective.matches.map((x,i)=>x===''?'—':PARA_FUNCTIONS[Number(x)]).join(' | ')}`,'',
 'STAGE 5 · UPGRADE THE WRITING',...state.edits.items.flatMap((e,i)=>[`Challenge ${i+1}: ${EDIT_CASES[i].prompt}`,`My revision: ${e.revision||'—'}`]),'',
 'STAGE 6 · ESSAY SPRINT',...state.sprint.plan.map((x,i)=>`Plan ${i+1}: ${x||'—'}`),'',`BODY PARAGRAPH (${wordCount(state.sprint.paragraph)} words)`,state.sprint.paragraph||'—','',
 'SELF-CHECK',...state.sprint.checks.map((v,i)=>`${v?'[x]':'[ ]'} ${CHECKS[i][0]}: ${CHECKS[i][1]}`),'',
 'Full exam essay: 220–260 words.'];
 const blob=new Blob([lines.join('\n')],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),aTag=document.createElement('a');aTag.href=url;aTag.download='C1_Advanced_Essay_Workshop_Notes.txt';document.body.append(aTag);aTag.click();aTag.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);
}
function preserveScroll(fn){const sy=window.scrollY;fn();window.scrollTo({top:sy,behavior:'instant'});}
function rerender(){preserveScroll(draw);}
function applyField(target,value){const key=target.dataset.field;
 if(key==='stance.justification')state.stance.justification=value;
 else if(key==='stance.response')state.stance.response=value;
 else if(key==='argument.comparison')state.argument.comparison=value;
 else if(key==='argument.objectionResponse')state.argument.objectionResponse=value;
 else if(key==='edit.revision')state.edits.items[state.edits.index].revision=value;
 else if(key==='sprint.paragraph'){state.sprint.paragraph=value;const wc=byId('word-counter');if(wc)wc.textContent=wordCount(value)+' words';}
 if(target.dataset.argField==='implication')state.argument.choices[target.dataset.method].implication=value;
 if(target.dataset.plan!==undefined)state.sprint.plan[Number(target.dataset.plan)]=value;
}
byId('stage-content').addEventListener('input',e=>{const t=e.target;if(t.matches('textarea'))applyField(t,t.value);});
byId('stage-content').addEventListener('change',e=>{
 const t=e.target;if(t.matches('textarea'))applyField(t,t.value);
 if(t.dataset.action==='arg-select'){const k=t.dataset.value,a=state.argument;if(t.checked){if(a.selected.length<2)a.selected.push(k);}else {a.selected=a.selected.filter(v=>v!==k);if(a.winner===k){a.winner='';a.objectionShown=false;}}a.focus=Math.min(a.focus,Math.max(0,a.selected.length-1));rerender();}
 if(t.dataset.action==='detect-match'){state.detective.matches[Number(t.dataset.index)]=t.value;if(state.detective.checked){state.detective.checked=false;rerender();}}
 if(t.dataset.action==='sprint-check'){state.sprint.checks[Number(t.dataset.index)]=t.checked;}
});
byId('stage-select').addEventListener('change',e=>navigate(Number(e.target.value)));
function handleAction(action,btn){const n=Number(btn.dataset.index),v=btn.dataset.value;
 switch(action){
 case 'book':openBook(Number(btn.dataset.page));break;
 case 'navigate':navigate(n);break;
 case 'timer':timerToggle();break;
 case 'reset-stage':if(confirm('Clear responses and restart this stage?'))stageReset();break;
 case 'export':exportWork();break;
 case 'stance':state.stance.position=v;state.stance.counter=false;rerender();break;
 case 'counter':state.stance.counter=!state.stance.counter;rerender();break;
 case 'quiz-select':state.task.answers[state.task.index]=n;state.task.checked[state.task.index]=false;rerender();break;
 case 'quiz-check':state.task.checked[state.task.index]=true;rerender();break;
 case 'quiz-prev':state.task.index=Math.max(0,state.task.index-1);rerender();break;
 case 'quiz-next':state.task.index=Math.min(QUESTIONS.length-1,state.task.index+1);rerender();break;
 case 'arg-focus':state.argument.focus=n;rerender();break;
 case 'arg-option':state.argument.choices[btn.dataset.method][btn.dataset.type]=n;rerender();break;
 case 'arg-winner':state.argument.winner=v;state.argument.objectionShown=false;rerender();break;
 case 'arg-objection':state.argument.objectionShown=!state.argument.objectionShown;rerender();break;
 case 'detect-choice':state.detective[btn.dataset.type]=v;state.detective.checked=false;rerender();break;
 case 'detect-check':state.detective.checked=true;rerender();break;
 case 'edit-diagnosis':state.edits.items[state.edits.index].diagnosis=v;rerender();break;
 case 'edit-reveal':state.edits.items[state.edits.index].revealed=!state.edits.items[state.edits.index].revealed;rerender();break;
 case 'edit-prev':state.edits.index=Math.max(0,state.edits.index-1);rerender();break;
 case 'edit-next':state.edits.index=Math.min(2,state.edits.index+1);rerender();break;
 case 'copy-paragraph':{const para=state.sprint.paragraph;if(!para.trim()){alert('Write a paragraph before copying.');return;}if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(para).then(()=>{btn.textContent='Copied';setTimeout(()=>btn.textContent='Copy paragraph',1500)}).catch(()=>prompt('Copy your paragraph:',para));}else prompt('Copy your paragraph:',para);break;}
 }
}
document.addEventListener('click',e=>{const btn=e.target.closest('[data-action]');if(!btn||btn.disabled)return;handleAction(btn.dataset.action,btn);});
byId('text-up').addEventListener('click',()=>{state.readScale=Math.min(1.45,Math.round((state.readScale+.1)*100)/100);document.documentElement.style.setProperty('--reader-scale',state.readScale);});
byId('text-down').addEventListener('click',()=>{state.readScale=Math.max(.9,Math.round((state.readScale-.1)*100)/100);document.documentElement.style.setProperty('--reader-scale',state.readScale);});
byId('book-download').addEventListener('click',downloadBook);
byId('reset-lesson').addEventListener('click',()=>{if(confirm('Reset the entire workshop? All unsaved student answers will be erased.')){timerPause(state.stage);state=emptyState();document.documentElement.style.setProperty('--reader-scale',1);draw();window.scrollTo({top:0,behavior:'instant'});}});
window.addEventListener('beforeunload',e=>{ /* No browser storage: opening the file again starts a fresh student. */ });
draw();
</script>
</body>
</html>
